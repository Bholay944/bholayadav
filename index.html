<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BholaYadav.com is currently under construction. Coming soon.">
  <title>BholaYadav.com — Coming Soon</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: #ffffff;
      background:
        radial-gradient(circle at 50% 35%, #102a4d 0%, #07111f 42%, #02060c 100%);
    }

    .page {
      width: 100%;
      padding: 30px;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      margin-bottom: 32px;
      border-radius: 18px;
      background: linear-gradient(135deg, #1687ff, #0751a1);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -1px;
      box-shadow: 0 15px 45px rgba(22, 135, 255, 0.25);
    }

    .construction {
      display: inline-block;
      margin-bottom: 22px;
      padding: 8px 15px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 50px;
      color: #a9bdd3;
      background: rgba(255, 255, 255, 0.04);
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(44px, 8vw, 82px);
      line-height: 1;
      letter-spacing: -4px;
      margin-bottom: 20px;
    }

    h1 span {
      background: linear-gradient(90deg, #ffffff, #62b7ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .message {
      max-width: 520px;
      margin: 0 auto;
      color: #91a1b5;
      font-size: 17px;
      line-height: 1.7;
    }

    .loader {
      width: 180px;
      height: 4px;
      margin: 35px auto 0;
      overflow: hidden;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
    }

    .loader::before {
      content: "";
      display: block;
      width: 55%;
      height: 100%;
      border-radius: 20px;
      background: linear-gradient(90deg, #1687ff, #ff9d4d);
      animation: loading 2s ease-in-out infinite;
    }

    @keyframes loading {
      0% { transform: translateX(-110%); }
      50% { transform: translateX(100%); }
      100% { transform: translateX(280%); }
    }

    .coming {
      margin-top: 22px;
      color: #64758a;
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .footer {
      position: fixed;
      bottom: 24px;
      left: 0;
      width: 100%;
      text-align: center;
      color: #4e5d6f;
      font-size: 11px;
    }

    @media (max-width: 600px) {
      h1 {
        letter-spacing: -2px;
      }

      .message {
        font-size: 15px;
      }

      .logo {
        width: 56px;
        height: 56px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="logo">BY</div>

    <div class="construction">Under Construction</div>

    <h1>Coming <span>Soon.</span></h1>

    <p class="message">
      We're building something new for you.
      <br>
      BholaYadav.com will be live soon.
    </p>

    <div class="loader"></div>

    <div class="coming">Stay tuned</div>

  </main>

  <div class="footer">
    © 2026 BholaYadav.com
  </div>

</body>
</html>
